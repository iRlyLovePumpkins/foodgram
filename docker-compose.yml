version: '3'

volumes:
  pg_data_production:
  static_volume:
  media_volume:

services:
  db:
    image: postgres:15-alpine
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data

  backend:
    image: pumpkinhunter/foodgram_backend
    env_file: .env
    volumes:
      - static_volume:/backend_static
      - media_volume:/app/media/
      - ./data:/app/data
    depends_on:
      - db

  frontend:
    image: pumpkinhunter/foodgram_frontend
    env_file: .env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static_volume:/frontend_static

  gateway:
    image: pumpkinhunter/foodgram_gateway
    env_file: .env
    ports:
      - 10000:80
    volumes:
      - static_volume:/usr/share/nginx/html/
      - media_volume:/app/media/
    depends_on:
      - backend
      - frontend